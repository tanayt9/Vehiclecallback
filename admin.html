<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin JSON Generator</title>

<style>
body{
  margin:0;
  background:#f4f7fb;
  color:#0f172a;
  font-family:Inter,system-ui,sans-serif
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:30px 18px
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:23px;
  margin-top:18px;
  box-shadow:0 18px 45px rgba(15,23,42,.07)
}

h1{
  margin:0
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}

.label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin:14px 0 7px
}

input{
  width:100%;
  box-sizing:border-box;
  border:1px solid #cfd7e3;
  border-radius:10px;
  padding:12px;
  font:inherit
}

button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  background:#3157d5;
  color:white;
  font-weight:800;
  cursor:pointer;
  margin-top:16px
}

button:disabled{
  opacity:.6;
  cursor:not-allowed
}

.secondary{
  background:#e9eefc;
  color:#2445b7
}

.danger{
  background:#fff0f0;
  color:#b42318
}

.list{
  display:grid;
  gap:9px;
  margin-top:15px
}

.item{
  border:1px solid #e2e8f0;
  padding:13px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  gap:10px
}

.muted{
  color:#64748b;
  font-size:13px
}

.msg{
  display:none;
  margin-top:12px;
  padding:11px;
  border-radius:10px
}

.show{
  display:block;
  background:#ecfdf3;
  color:#067647
}

.error{
  display:block;
  background:#fff1f0;
  color:#b42318
}

.token-count{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border-radius:99px;
  background:#eef2ff;
  color:#3157d5;
  font-size:11px;
  font-weight:800
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<main class="wrap">

<a href="index.html">← Callback Center</a>

<div class="card">

<h1>Admin JSON Generator</h1>

<p class="muted">
Add vehicles and register multiple devices for the same vehicle.
The data is stored locally in this browser.
</p>

<div class="grid">

<div>
<label class="label">Vehicle number</label>
<input
  id="v"
  placeholder="WB12AB1234"
  autocomplete="off">
</div>

<div>
<label class="label">Owner name</label>
<input
  id="n"
  placeholder="Owner name"
  autocomplete="name">
</div>

<div>
<label class="label">Mobile</label>
<input
  id="m"
  placeholder="9876543210"
  inputmode="numeric"
  autocomplete="tel">
</div>

<div>
<label class="label">FCM Device Token</label>
<input
  id="t"
  placeholder="Firebase device token"
  autocomplete="off">
</div>

</div>

<button id="add">Add / Register Device</button>

<button
  id="download"
  class="secondary"
  style="margin-left:7px">
  Download vehicles.json
</button>

<button
  id="clear"
  class="danger"
  style="margin-left:7px">
  Clear
</button>

<div id="msg" class="msg"></div>

<div id="list" class="list"></div>

</div>

</main>

<script>

const KEY = "vehicleRegistryDraftV4";

let rows = loadRows();

/*
  Normalize old and new data.

  Old format:
    fcmToken: "TOKEN"

  New format:
    fcmTokens: ["TOKEN1", "TOKEN2"]
*/
function normalizeRows(input){

  if(!Array.isArray(input)){
    return [];
  }

  return input.map(x => {

    let tokens = [];

    if(Array.isArray(x.fcmTokens)){
      tokens = x.fcmTokens;
    }

    /*
      Automatically migrate old single-token records.
    */
    if(x.fcmToken && !tokens.includes(x.fcmToken)){
      tokens.push(x.fcmToken);
    }

    /*
      Remove empty and duplicate tokens.
    */
    tokens = [
      ...new Set(
        tokens
          .map(t => String(t || "").trim())
          .filter(Boolean)
      )
    ];

    return {
      vehicleNo: String(x.vehicleNo || "").trim().toUpperCase(),
      ownerName: String(x.ownerName || "").trim(),
      mobile: String(x.mobile || "").trim(),
      fcmTokens: tokens,
      active: x.active !== false
    };

  });
}

function loadRows(){

  try{

    const saved = JSON.parse(
      localStorage.getItem(KEY) || "[]"
    );

    return normalizeRows(saved);

  }catch{

    /*
      Also try the previous storage key.
    */
    try{

      const old = JSON.parse(
        localStorage.getItem("vehicleRegistryDraftV3") || "[]"
      );

      return normalizeRows(old);

    }catch{

      return [];

    }

  }

}

function saveRows(){

  localStorage.setItem(
    KEY,
    JSON.stringify(rows)
  );

}

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}

function showMessage(text, success = true){

  const box = document.getElementById("msg");

  box.textContent = text;

  box.className =
    "msg " + (success ? "show" : "error");

}

function normalizeVehicle(s){

  return String(s || "")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"");

}

function normalizeMobile(s){

  return String(s || "")
    .replace(/\D/g,"");

}

/*
  Render vehicle list.
*/
function render(){

  const list = document.getElementById("list");

  if(!rows.length){

    list.innerHTML =
      "<div class='muted'>No vehicles added yet.</div>";

    saveRows();

    return;

  }

  list.innerHTML = rows.map((x,i) => {

    const tokenCount = x.fcmTokens.length;

    return `
      <div class="item">

        <div>

          <b>${esc(x.vehicleNo)}</b>

          <div class="muted">
            ${esc(x.ownerName)}
            ·
            ${esc(x.mobile)}
          </div>

          <span class="token-count">
            ${tokenCount}
            device${tokenCount === 1 ? "" : "s"}
            registered
          </span>

        </div>

        <button
          class="danger"
          style="margin:0"
          onclick="removeRow(${i})">
          Remove
        </button>

      </div>
    `;

  }).join("");

  saveRows();

}

/*
  Remove vehicle completely.
*/
window.removeRow = function(i){

  if(!rows[i]){
    return;
  }

  const vehicle = rows[i].vehicleNo;

  if(
    confirm(
      `Remove vehicle ${vehicle} and all registered devices?`
    )
  ){

    rows.splice(i,1);

    render();

    showMessage(
      `${vehicle} removed.`,
      true
    );

  }

};

/*
  Add vehicle OR register another device.
*/
document.getElementById("add").onclick = function(){

  const vehicle = normalizeVehicle(
    document.getElementById("v").value
  );

  const owner = document.getElementById("n").value.trim();

  const mobile = normalizeMobile(
    document.getElementById("m").value
  );

  const token = document.getElementById("t").value.trim();

  if(!vehicle){

    showMessage(
      "Vehicle number is required.",
      false
    );

    return;

  }

  if(!owner){

    showMessage(
      "Owner name is required.",
      false
    );

    return;

  }

  if(!mobile){

    showMessage(
      "Mobile number is required.",
      false
    );

    return;

  }

  /*
    Find existing vehicle.
  */
  const existingIndex = rows.findIndex(
    x => normalizeVehicle(x.vehicleNo) === vehicle
  );

  /*
    Vehicle already exists.
  */
  if(existingIndex !== -1){

    const existing = rows[existingIndex];

    /*
      Update owner/mobile information.
    */
    existing.ownerName = owner;
    existing.mobile = mobile;
    existing.active = true;

    /*
      Add new device token only if supplied.
    */
    if(token){

      if(!existing.fcmTokens.includes(token)){

        existing.fcmTokens.push(token);

        showMessage(
          `Device added to ${vehicle}. Total devices: ${existing.fcmTokens.length}`,
          true
        );

      }else{

        showMessage(
          "This device token is already registered for this vehicle.",
          true
        );

      }

    }else{

      showMessage(
        `${vehicle} already exists. No new device token was added.`,
        true
      );

    }

  }else{

    /*
      Create new vehicle.
    */
    rows.push({

      vehicleNo: vehicle,

      ownerName: owner,

      mobile: mobile,

      fcmTokens: token
        ? [token]
        : [],

      active: true

    });

    showMessage(
      `Vehicle ${vehicle} added successfully.`,
      true
    );

  }

  /*
    Clear fields.
  */
  ["v","n","m","t"].forEach(
    id => document.getElementById(id).value = ""
  );

  render();

};

/*
  Download vehicles.json.

  IMPORTANT:
  Only fcmTokens is exported.
  The old fcmToken property is never exported.
*/
document.getElementById("download").onclick = function(){

  const out = {

    version: 4,

    updatedAt:
      new Date().toISOString(),

    vehicles: rows.map(x => ({

      vehicleNo: x.vehicleNo,

      ownerName: x.ownerName,

      mobile: x.mobile,

      fcmTokens: [
        ...new Set(
          (Array.isArray(x.fcmTokens)
            ? x.fcmTokens
            : []
          )
          .map(t => String(t || "").trim())
          .filter(Boolean)
        )
      ],

      active: x.active !== false

    }))

  };

  const json = JSON.stringify(
    out,
    null,
    2
  );

  const blob = new Blob(
    [json],
    {
      type:"application/json"
    }
  );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "vehicles.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );

  showMessage(
    `vehicles.json downloaded with ${rows.length} vehicle${rows.length === 1 ? "" : "s"}.`,
    true
  );

};

/*
  Clear all local data.
*/
document.getElementById("clear").onclick = function(){

  if(
    confirm(
      "Clear all locally stored vehicles and device tokens?"
    )
  ){

    rows = [];

    render();

    showMessage(
      "Local registry cleared.",
      true
    );

  }

};

/*
  Initial render.
*/
render();

</script>

</body>
</html>
